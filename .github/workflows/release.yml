name: Release Linux bundles

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and publish AppImage, DEB and RPM
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DSH Desktop ${{ github.ref_name }}
          releaseBody: |
            Linux bundles for DSH Desktop.

            AppImage works on most distributions. DEB is intended for Debian/Ubuntu; RPM for Fedora/openSUSE.
          releaseDraft: true
          prerelease: false
