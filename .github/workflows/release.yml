name: Release Linux bundles

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and publish AppImage, DEB and RPM
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DSH Desktop ${{ github.ref_name }}
          releaseBody: |
            Linux bundles for DSH Desktop.

            - AppImage works on most distributions, including Arch and CachyOS.
            - DEB is intended for Debian, Ubuntu and derivatives.
            - RPM is intended for Fedora, openSUSE and derivatives.

            DSH Desktop launches DeepSeek Harness Web without a terminal. On first start it detects an existing `dsh` installation or offers to install one into `~/.local/share/dsh-desktop/runtime`. Installing from the app requires `node` and `npm`.
          releaseDraft: true
          prerelease: false
