[package]
name = "dsh-tauri"
version = "0.1.0"
description = "DeepSeek Harness desktop launcher"
authors = ["DSH contributors"]
edition = "2021"

[lib]
name = "dsh_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Experimental branch: Vulkan adapter probe and future native renderer path.
wgpu = "0.20"
pollster = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
