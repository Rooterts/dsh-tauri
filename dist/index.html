<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DeepSeek Harness</title>
<style>
/* Design tokens taken from the DSH Web dark theme (@deepseek-ai/dsh-client-ui-theme). */
:root{
  color-scheme:dark;
  --bg-base:#151517;
  --bg-layer-1:#232324;
  --bg-layer-2:#2c2c2e;
  --bg-layer-3:#353638;
  --bg-code:#1b1b1c;
  --label-primary:#f9fafb;
  --label-secondary:#cfd3d6;
  --label-tertiary:#adb2b8;
  --label-caption:#81858c;
  --border-l1:#ffffff0f;
  --border-l2:#ffffff1f;
  --border-l3:#ffffff29;
  --border-l4:#ffffff33;
  --brand:#f9fafb;
  --on-brand:#0f1115;
  --hover:#ffffff14;
  --active:#ffffff24;
  --success:#22c55e;
  --warn:#f59e0b;
  --error:#f25a5a;
  --idle:#545557;
  --accent:#7aaaff;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-panel:28px;
  --elevation-stroke:0 0 0 .5px var(--border-l2);
  --elevation-panel:var(--elevation-stroke), 0 3px 8px 0 #00000008, 0 0 16px 0 #00000005;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-code:"SF Mono", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", Menlo, Courier, monospace;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;place-items:center;background:var(--bg-base);color:var(--label-primary);font-family:var(--font);-webkit-font-smoothing:antialiased}
.boot{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:440px;padding:24px}
.spinner{position:relative;width:20px;height:20px;border-radius:50%;border:2px solid var(--border-l2);animation:spin .8s linear infinite}
.spinner:after{content:"";position:absolute;inset:-2px;border-radius:inherit;background:conic-gradient(var(--brand) 72deg, transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 0)}
@keyframes spin{to{transform:rotate(360deg)}}
.wordmark{font-size:16px;line-height:24px;font-weight:600;letter-spacing:.08em;color:var(--label-primary)}
.hint{font-size:12px;line-height:18px;color:var(--label-tertiary);text-align:center;margin:0}
.panel{width:100%;margin-top:8px;padding:20px;border-radius:var(--radius-panel);background:var(--bg-layer-2);box-shadow:var(--elevation-panel)}
.section{display:flex;flex-direction:column;gap:14px}
.section+.section{margin-top:16px;padding-top:16px;border-top:.5px solid var(--border-l2)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--label-secondary)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.ok{background:var(--success)}
.dot.bad{background:var(--error)}
.copy{font-size:13px;line-height:20px;color:var(--label-secondary);margin:0}
.check{display:flex;align-items:center;gap:6px;font-size:14px;line-height:20px;color:var(--label-primary);cursor:pointer;user-select:none}
.check input{flex:none;width:16px;height:16px;margin:0;accent-color:var(--brand);cursor:inherit}
.row{display:flex;align-items:center;gap:8px}
select{flex:1;min-width:0;height:32px;padding:0 10px;border:.5px solid var(--border-l4);border-radius:var(--radius-md);background-color:var(--bg-layer-1);color:var(--label-primary);font-family:inherit;font-size:14px}
select:focus-visible{border-color:var(--accent);outline:none}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--label-primary);font-family:inherit;font-size:14px;line-height:22px;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
.primary{background:var(--brand);color:var(--on-brand)}
.primary:hover:not(:disabled){background:#ebeef2}
.ghost:hover:not(:disabled){background:var(--hover)}
.ghost:active:not(:disabled){background:var(--active)}
.outline{border:.5px solid var(--border-l4)}
.outline:hover:not(:disabled){background:var(--hover)}
.btn-spinner{width:14px;height:14px;border-width:2px;border-color:var(--border-l3);border-top-color:var(--on-brand)}
.btn-spinner:after{display:none}
.note{font-size:12px;line-height:18px;color:var(--label-caption);margin:0}
.notice{font-size:12px;line-height:18px;color:var(--warn);margin:0}
.error{font-size:12px;line-height:18px;color:var(--error);margin:0;white-space:pre-wrap}
.ok{font-size:12px;line-height:18px;color:var(--success);margin:0}
code{padding:1px 5px;border-radius:var(--radius-xs,4px);background:var(--bg-code);font-family:var(--font-code);font-size:12px}
.hidden{display:none}
</style>
</head>
<body>
<main class="boot">
<span class="spinner" id="boot-spinner"></span>
<span class="wordmark">DeepSeek Harness</span>
<p class="hint" id="subtitle">Iniciando el servidor local…</p>
<section class="panel hidden" id="installer">
<div class="section">
<div class="status"><span class="dot" id="dot-dsh"></span><span id="status-dsh">Comprobando DSH…</span></div>
<div class="status"><span class="dot" id="dot-node"></span><span id="status-node">Comprobando Node.js…</span></div>
</div>
<div class="section" id="install-section">
<p class="copy">DeepSeek Harness no está instalado. Puedes instalarlo ahora, sin usar la terminal.</p>
<label class="check"><input type="checkbox" id="prerelease"> Mostrar versiones preliminares (rc, beta, alpha)</label>
<div class="row">
<select id="versions" disabled><option>Cargando…</option></select>
<button id="reload" class="outline">Ver versiones</button>
</div>
<div class="row">
<button id="install" class="primary">Instalar</button>
<span class="spinner hidden" id="spinner"></span>
</div>
<p class="note">Se instalará en <code>~/.local/share/dsh-desktop/runtime</code>.</p>
</div>
<div class="section hidden" id="ready-section">
<div class="row"><button id="start" class="primary">Abrir DeepSeek Harness</button></div>
</div>
<p class="notice hidden" id="notice"></p>
<p class="error hidden" id="error"></p>
<p class="ok hidden" id="ok"></p>
<p class="note hidden" id="node-hint"></p>
</section>
</main>
<script>
(function () {
  var invoke = window.__TAURI__.core.invoke;
  var el = function (id) { return document.getElementById(id); };
  var busy = false;

  function show(id, message) {
    var node = el(id);
    if (message) { node.textContent = message; node.classList.remove("hidden"); }
    else { node.textContent = ""; node.classList.add("hidden"); }
  }

  function setBusy(value) {
    busy = value;
    el("install").disabled = value || el("versions").disabled;
    el("reload").disabled = value;
    el("start").disabled = value;
    el("install").textContent = value ? "Instalando…" : "Instalar";
    el("spinner").classList.toggle("hidden", !value);
  }

  function renderVersions(versions) {
    var select = el("versions");
    select.innerHTML = "";
    if (!versions || !versions.length) {
      var empty = document.createElement("option");
      empty.textContent = "Sin versiones disponibles";
      select.appendChild(empty);
      select.disabled = true;
      el("install").disabled = true;
      return;
    }
    versions.forEach(function (version) {
      var option = document.createElement("option");
      option.value = version;
      option.textContent = version + (version.indexOf("-") === -1 ? "  (estable)" : "  (preliminar)");
      select.appendChild(option);
    });
    select.disabled = false;
    el("install").disabled = busy;
  }

  function loadVersions() {
    show("error", "");
    show("ok", "");
    show("notice", "");
    var select = el("versions");
    select.innerHTML = "";
    var placeholder = document.createElement("option");
    placeholder.textContent = "Cargando…";
    select.appendChild(placeholder);
    select.disabled = true;
    el("install").disabled = true;
    invoke("list_dsh_versions", { includePrerelease: el("prerelease").checked })
      .then(function (versions) {
        if (!versions.length && !el("prerelease").checked) {
          el("prerelease").checked = true;
          show("notice", "Todavía no hay versiones estables publicadas. Se muestran las preliminares.");
          return invoke("list_dsh_versions", { includePrerelease: true }).then(renderVersions);
        }
        renderVersions(versions);
      })
      .catch(function (error) { show("error", String(error)); });
  }

  function install() {
    var version = el("versions").value;
    if (!version) { show("error", "Selecciona una versión"); return; }
    show("error", "");
    show("ok", "");
    setBusy(true);
    invoke("install_dsh", { version: version })
      .then(function () {
        setBusy(false);
        show("ok", "DeepSeek Harness " + version + " instalado.");
        return refreshStatus();
      })
      .catch(function (error) {
        setBusy(false);
        show("error", String(error));
      });
  }

  function start() {
    show("error", "");
    invoke("start_dsh").then(function () {
      el("subtitle").textContent = "Iniciando el servidor local…";
      el("installer").classList.add("hidden");
    }).catch(function (error) { show("error", String(error)); });
  }

  function refreshStatus() {
    return invoke("dsh_status").then(function (status) {
      el("dot-dsh").className = "dot " + (status.available ? "ok" : "bad");
      el("dot-node").className = "dot " + (status.nodeAvailable ? "ok" : "bad");
      el("status-dsh").textContent = status.available
        ? (status.managed ? "DeepSeek Harness detectado (instalado por la aplicación)" : "DeepSeek Harness detectado (instalado en el sistema)")
        : "DeepSeek Harness no detectado";
      el("status-node").textContent = status.nodeAvailable
        ? "Node.js y npm disponibles"
        : "Node.js y npm no disponibles";
      show("node-hint", status.nodeAvailable ? "" : "La instalación necesita Node.js y npm. En Arch/CachyOS: sudo pacman -S nodejs npm");
      if (status.available) {
        el("install-section").classList.add("hidden");
        el("ready-section").classList.remove("hidden");
        el("subtitle").textContent = "Listo para usar.";
      } else {
        el("install-section").classList.remove("hidden");
        el("ready-section").classList.add("hidden");
        el("subtitle").textContent = "Necesitas instalar DeepSeek Harness para continuar.";
      }
      return status;
    });
  }

  el("prerelease").addEventListener("change", loadVersions);
  el("reload").addEventListener("click", loadVersions);
  el("install").addEventListener("click", install);
  el("start").addEventListener("click", start);

  refreshStatus()
    .then(function (status) {
      if (!status.available) {
        el("installer").classList.remove("hidden");
        loadVersions();
      }
    })
    .catch(function (error) {
      el("installer").classList.remove("hidden");
      show("error", "No se pudo comprobar DeepSeek Harness: " + String(error));
      loadVersions();
    });
})();
</script>
</body>
</html>
